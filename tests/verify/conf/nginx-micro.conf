user nginx;
worker_processes 1;
error_log /dev/stdout;
pid /nginx.pid;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    server {
        listen 80 default_server;
        root /www;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
