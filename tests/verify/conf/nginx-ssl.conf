user nginx;
worker_processes 1;
error_log /dev/stdout;
pid /nginx.pid;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    # Loopback backend + pooled upstream: proves the keepalive module is
    # compiled in and that reverse proxying works.
    upstream verify_backend {
        server 127.0.0.1:8081;
        keepalive 4;
    }

    server {
        listen 127.0.0.1:8081;
        root /www;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /conf/nginx.crt;
        ssl_certificate_key /conf/nginx.key;

        root /www;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /proxied/ {
            proxy_pass http://verify_backend/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
