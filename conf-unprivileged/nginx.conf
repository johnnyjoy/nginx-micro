
# Unprivileged variant: the master process runs as UID 101 (nginx), so there is
# no "user" directive (it is a no-op without root and only emits a warning).
# The image binds high ports only and keeps every runtime-writable path under
# /tmp, which is the single directory owned by uid 101 in the image.

worker_processes  1;

error_log  /dev/stdout;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Unprivileged user can only write under /tmp, so all temp paths live there.
    client_body_temp_path  /tmp/client_body;
    proxy_temp_path        /tmp/proxy;
    fastcgi_temp_path      /tmp/fastcgi;

    log_format standard '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout standard;

    sendfile           on;
    keepalive_timeout  65;

    server {
        listen       8080 default_server;
        server_name  _;

        root   /www;
        index  index.html index.php;

        location / {
            try_files $uri $uri/ =404;
        }

        # For PHP-FPM (if enabled/linked)
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass   php-fpm:9000;
            fastcgi_index  index.php;
            include        fastcgi_params;
        }
    }
}
