name: Build test (no publish)

# Validates that every image variant still compiles on EVERY target platform on
# each push/PR, WITHOUT pushing anything to a registry. This mirrors the release
# matrix (so arch-specific breakage like the riscv64 OpenSSL asm issue is caught
# before tagging) but exports nothing. Publishing is handled by release.yml,
# which runs only on version tags.

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  NGINX_VERSION: "1.31.2"

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: linux-amd64
            targets: nginx-micro,nginx-micro-upx,nginx-gzip,nginx-gzip-upx,nginx-ssi,nginx-ssi-upx,nginx-ssl,nginx-ssl-upx,nginx-ssl-unprivileged,nginx-ssl-unprivileged-upx
          - platform: linux/386
            runner: ubuntu-latest
            slug: linux-386
            targets: nginx-micro,nginx-micro-upx,nginx-gzip,nginx-gzip-upx,nginx-ssi,nginx-ssi-upx,nginx-ssl,nginx-ssl-upx,nginx-ssl-unprivileged,nginx-ssl-unprivileged-upx
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64
            targets: nginx-micro,nginx-micro-upx,nginx-gzip,nginx-gzip-upx,nginx-ssi,nginx-ssi-upx,nginx-ssl,nginx-ssl-upx,nginx-ssl-unprivileged,nginx-ssl-unprivileged-upx
          - platform: linux/arm/v7
            runner: ubuntu-24.04-arm
            slug: linux-arm-v7
            targets: nginx-micro,nginx-micro-upx,nginx-gzip,nginx-gzip-upx,nginx-ssi,nginx-ssi-upx,nginx-ssl,nginx-ssl-upx,nginx-ssl-unprivileged,nginx-ssl-unprivileged-upx
          - platform: linux/arm/v6
            runner: ubuntu-24.04-arm
            slug: linux-arm-v6
            targets: nginx-micro,nginx-micro-upx,nginx-gzip,nginx-gzip-upx,nginx-ssi,nginx-ssi-upx,nginx-ssl,nginx-ssl-upx,nginx-ssl-unprivileged,nginx-ssl-unprivileged-upx
          - platform: linux/ppc64le
            runner: ubuntu-latest
            slug: linux-ppc64le
            targets: nginx-micro,nginx-micro-upx,nginx-gzip,nginx-gzip-upx,nginx-ssi,nginx-ssi-upx,nginx-ssl,nginx-ssl-upx,nginx-ssl-unprivileged,nginx-ssl-unprivileged-upx
          # s390x and riscv64 are not in UPX_PLATFORMS, so skip the -upx targets.
          - platform: linux/s390x
            runner: ubuntu-latest
            slug: linux-s390x
            targets: nginx-micro,nginx-gzip,nginx-ssi,nginx-ssl,nginx-ssl-unprivileged
          - platform: linux/riscv64
            runner: ubuntu-latest
            slug: linux-riscv64
            targets: nginx-micro,nginx-gzip,nginx-ssi,nginx-ssl,nginx-ssl-unprivileged
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # type=cacheonly runs the full build for this platform but exports nothing
      # (no load, no push). No registry credentials are needed, so this also runs
      # on fork PRs. GitHub Actions cache (separate from the release cache) keeps
      # reruns fast.
      - name: Build ${{ matrix.platform }} (no publish)
        uses: docker/bake-action@v5
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        with:
          files: docker-bake.hcl
          targets: ${{ matrix.targets }}
          set: |
            *.platform=${{ matrix.platform }}
            *.output=type=cacheonly
            *.cache-from=type=gha,scope=buildtest-${{ matrix.slug }}
            *.cache-to=type=gha,scope=buildtest-${{ matrix.slug }},mode=max

  # After the compile matrix, build each amd64 variant into Docker and run
  # verify-images for that variant only. One job per tag = clear CI signal.
  verify:
    name: verify ${{ matrix.variant }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - micro
          - micro-upx
          - gzip
          - gzip-upx
          - ssi
          - ssi-upx
          - ssl
          - ssl-upx
          - ssl-unprivileged
          - ssl-unprivileged-upx
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.variant }} (load locally)
        uses: docker/bake-action@v5
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        with:
          files: docker-bake.hcl
          targets: nginx-${{ matrix.variant }}
          set: |
            *.platform=linux/amd64
            *.output=type=docker
            *.cache-from=type=gha,scope=buildtest-linux-amd64
            *.cache-to=type=gha,scope=buildtest-linux-amd64,mode=max

      - name: Verify ${{ matrix.variant }}
        run: |
          ./scripts/verify-images \
            --variant "${{ matrix.variant }}" \
            --version "${{ env.NGINX_VERSION }}" \
            --prefix tigersmile/nginx-micro
