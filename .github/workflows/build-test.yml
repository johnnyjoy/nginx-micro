name: Build test (no publish)

# Validates that every image variant still compiles on EVERY target platform on
# each push/PR, WITHOUT pushing anything to a registry. This mirrors the release
# matrix (so arch-specific breakage like the riscv64 OpenSSL asm issue is caught
# before tagging) but exports nothing. Publishing is handled by release.yml,
# which runs only on version tags.

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  NGINX_VERSION: "1.31.8"

jobs:
  # Build/verify matrices come from docker-bake.hcl (scripts/ci-matrix), so the
  # platform list and which platforms get -upx targets live in one place.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gen.outputs.build }}
      verify: ${{ steps.gen.outputs.verify }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: gen
        run: |
          build="$(scripts/ci-matrix build)"
          verify="$(scripts/ci-matrix verify)"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "verify=${verify}" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.platform }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.build) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # type=cacheonly runs the full build for this platform but exports nothing
      # (no load, no push). No registry credentials are needed, so this also runs
      # on fork PRs. GitHub Actions cache (separate from the release cache) keeps
      # reruns fast.
      - name: Build ${{ matrix.platform }} (no publish)
        uses: docker/bake-action@v5
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        with:
          files: docker-bake.hcl
          targets: ${{ matrix.targets }}
          set: |
            *.platform=${{ matrix.platform }}
            *.output=type=cacheonly
            *.cache-from=type=gha,scope=buildtest-${{ matrix.slug }}
            *.cache-to=type=gha,scope=buildtest-${{ matrix.slug }},mode=max

  # After the compile matrix, load each platform/variant image into Docker and
  # run verify-images against it. One job per (platform, tag) = clear CI signal.
  verify:
    name: verify ${{ matrix.platform }} ${{ matrix.variant }}
    needs: [matrix, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.verify) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.variant }} for ${{ matrix.platform }} (load locally)
        uses: docker/bake-action@v5
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        with:
          files: docker-bake.hcl
          targets: nginx-${{ matrix.variant }}
          set: |
            *.platform=${{ matrix.platform }}
            *.output=type=docker
            *.cache-from=type=gha,scope=buildtest-${{ matrix.slug }}
            *.cache-to=

      - name: Verify ${{ matrix.variant }} on ${{ matrix.platform }}
        run: |
          ./scripts/verify-images \
            --variant "${{ matrix.variant }}" \
            --platform "${{ matrix.platform }}" \
            --version "${{ env.NGINX_VERSION }}" \
            --prefix tigersmile/nginx-micro
