name: Build test (no publish)

# Validates that every image variant still compiles on each push/PR, WITHOUT
# pushing anything to a registry. Release publishing is handled separately by
# release.yml (which runs only on version tags).

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the full default group (all variants, incl. unprivileged) natively
      # on amd64. type=cacheonly runs the complete build but exports nothing, so
      # nothing is loaded or pushed. GitHub Actions cache keeps reruns fast.
      - name: Build all variants (amd64, no publish)
        uses: docker/bake-action@v5
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
        with:
          files: docker-bake.hcl
          targets: default
          set: |
            *.platform=linux/amd64
            *.output=type=cacheonly
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
